name: BitSight
description: >-
  Bitsight is a global cyber risk intelligence platform that combines security
  ratings, external attack surface management (EASM), third-party risk management
  (TPRM), and cyber threat intelligence (CTI) in a single data model. Its outside-in,
  agentless monitoring produces continuously updated security ratings validated
  against real-world breach likelihood, powering vendor risk workflows, insurance
  underwriting, and capital-markets portfolio oversight for more than 3,500
  organizations across 60+ countries. Bitsight exposes a RESTful HTTP API at
  api.bitsighttech.com (companies, portfolios, ratings, findings, alerts, and CTI)
  authenticated with an API token over HTTP Basic, documented in the Bitsight
  Knowledge Base and an interactive Stoplight reference.
